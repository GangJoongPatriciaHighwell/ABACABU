<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김경중 - OOP Homework</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Noto Sans KR", sans-serif;
            color: white;

            /* 첨부한 두 이미지를 2x2 바둑판으로 합친 이미지가 반복됨 */
            background-image: url("background-tile.jpg");
            background-repeat: repeat;
            background-size: 720px 720px;
            background-attachment: fixed;
        }

        /* 배경이 너무 강하게 보이지 않도록 아주 약한 검정 필터 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.16);
            pointer-events: none;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            width: min(900px, calc(100% - 32px));
            margin: 70px auto;
        }

        .panel {
            background: rgba(0, 0, 0, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px;
            padding: 38px;
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(5px);
        }

        .profile {
            text-align: center;
            margin-bottom: 38px;
        }

        .profile h1 {
            margin: 0 0 12px;
            font-size: clamp(30px, 5vw, 48px);
            letter-spacing: 1px;
        }

        .profile p {
            margin: 6px 0;
            color: #dddddd;
            font-size: 18px;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.18);
            margin: 30px 0;
        }

        .section-title {
            margin: 0 0 20px;
            font-size: 24px;
        }

        .homework-list {
            display: grid;
            gap: 13px;
        }

        .homework {
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
        }

        .homework-button {
            width: 100%;
            border: 0;
            padding: 17px 20px;
            background: transparent;
            color: white;
            text-align: left;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .homework-button:hover {
            background: rgba(255,255,255,0.10);
        }

        .arrow {
            transition: transform 0.2s ease;
        }

        .homework.open .arrow {
            transform: rotate(180deg);
        }

        .sub-menu {
            display: none;
            padding: 0 14px 14px;
            gap: 9px;
        }

        .homework.open .sub-menu {
            display: grid;
        }

        .sub-link,
        .sub-placeholder {
            display: block;
            padding: 13px 16px;
            border-radius: 9px;
            text-decoration: none;
            font-size: 16px;
        }

        .sub-link {
            color: white;
            background: #222;
            border: 1px solid #444;
        }

        .sub-link:hover {
            background: #333;
        }

        .sub-placeholder {
            color: #888;
            background: #171717;
            border: 1px dashed #444;
            cursor: default;
        }

        .footer-note {
            margin-top: 26px;
            color: #999;
            font-size: 14px;
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                background-size: 520px 520px;
            }

            .page {
                margin: 28px auto;
                width: min(94%, 900px);
            }

            .panel {
                padding: 24px 18px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="panel">
            <div class="profile">
                <h1>김경중</h1>
                <p>컴퓨터공학전공</p>
                <p>2학년</p>
            </div>

            <div class="divider"></div>

            <h2 class="section-title">OBJECT ORIENTED PROGRAMMING</h2>

            <div class="homework-list">

                <div class="homework">
                    <button class="homework-button" type="button">
                        <span>HOMEWORK 1</span>
                        <span class="arrow">▼</span>
                    </button>

                    <div class="sub-menu">
                        <!-- 나중에 href 안의 # 부분을 실제 파일명으로 바꾸면 됨 -->
                        <a class="sub-link" href="homework1_1.java" target="_blank">1-1</a>
                        <a class="sub-link" href="#">1-2</a>
                        <a class="sub-link" href="#">1-3</a>
                        <a class="sub-link" href="#">1-4</a>
                    </div>
                </div>

                <div class="homework">
                    <button class="homework-button" type="button">
                        <span>HOMEWORK 2</span>
                        <span class="arrow">▼</span>
                    </button>

                    <div class="sub-menu">
                        <!-- 현재는 2-1 버튼만 만들어 둠 -->
                        <a class="sub-link" href="#">2-1</a>
                    </div>
                </div>

                <div class="homework">
                    <button class="homework-button" type="button">
                        <span>HOMEWORK 3</span>
                        <span class="arrow">▼</span>
                    </button>

                    <div class="sub-menu">
                        <div class="sub-placeholder">아직 없음</div>
                    </div>
                </div>

                <div class="homework">
                    <button class="homework-button" type="button">
                        <span>HOMEWORK 4</span>
                        <span class="arrow">▼</span>
                    </button>

                    <div class="sub-menu">
                        <div class="sub-placeholder">아직 없음</div>
                    </div>
                </div>

            </div>

            <p class="footer-note">
            
            </p>
        </section>
    </main>

    <script>
        document.querySelectorAll(".homework-button").forEach((button) => {
            button.addEventListener("click", () => {
                button.parentElement.classList.toggle("open");
            });
        });

        /* href="#"인 임시 버튼을 눌러도 페이지 맨 위로 튀지 않게 함 */
        document.querySelectorAll('a[href="#"]').forEach((link) => {
            link.addEventListener("click", (event) => {
                event.preventDefault();
            });
        });
    </script>
</body>
</html>
